<!doctype html><html lang="fa" dir="rtl" data-bs-theme="dark" data-menu-color="dark" data-topbar-color="dark" data-menu-size="default"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد فروشگاه | Sport Shoes</title><link rel="icon" href="../larken/images/logo-sm.png"><link rel="stylesheet" href="../larken/assets/css/app.css"><link rel="stylesheet" href="../larken/assets/css/icons.css"><link rel="stylesheet" href="../larken/assets/css/fontiran.min.css"><link rel="stylesheet" href="admin.css"><script src="../larken/assets/js/config.js"></script><script src="../store-assets/data.js" defer></script><script src="shell.js" defer></script><script src="../larken/assets/js/app.js" defer></script><script src="../larken/assets/js/layout.js" defer></script><script src="admin.js" defer></script></head><body data-admin-page="dashboard"><div data-admin-content><div class="admin-dashboard-page"></div></div><script>fetch('dashboard-content.html').then(r=>r.text()).then(html=>{document.querySelector('.admin-dashboard-page').innerHTML=html;document.dispatchEvent(new Event('DOMContentLoaded'));const count=window.SportShoes.products.length;document.querySelector('[data-dashboard-product-count]').textContent=new Intl.NumberFormat('fa-IR').format(count);document.querySelector('[data-dashboard-low-stock]').textContent=new Intl.NumberFormat('fa-IR').format(window.SportShoes.products.filter(p=>p.stock>0&&p.stock<10).length);const recent=[['SS-1408','نرگس حیدری','Velocity Pro 2','۴,۸۹۰,۰۰۰','در حال پردازش'],['SS-1407','آرمان رضایی','Urban Flex','۳,۱۹۰,۰۰۰','ارسال‌شده'],['SS-1406','الهام صادقی','Court Classic','۳,۶۵۰,۰۰۰','تکمیل‌شده']];document.querySelector('[data-dashboard-orders]').innerHTML=recent.map(row=>`<tr><td>#${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]} تومان</td><td><span class="badge bg-primary-subtle text-primary">${row[4]}</span></td></tr>`).join('');});</script></body></html>
